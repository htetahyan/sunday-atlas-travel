  - name: settings
    label: Settings
    files:
      - label: SEO settings
        name: seo
        file: content/settings/seo.json
        fields:
          - label: Title template
            name: title_template
            widget: object
            required: false
            hint: "%s is the page title. Example: %s | Sunday Atlas Travel."
            fields:
              - label: English
                name: en
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
              - label: German
                name: de
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
              - label: French
                name: fr
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
              - label: Japanese
                name: ja
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
              - label: Spanish
                name: es
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
              - label: Chinese (Simplified)
                name: zh
                widget: string
                required: false
                default: "%s | Sunday Atlas Travel"
          - label: Default description
            name: default_description
            widget: object
            required: false
            hint: "Used when a page has no description of its own."
            fields:
              - { label: English, name: en, widget: text, required: false }
              - { label: German, name: de, widget: text, required: false }
              - { label: French, name: fr, widget: text, required: false }
              - { label: Japanese, name: ja, widget: text, required: false }
              - { label: Spanish, name: es, widget: text, required: false }
              - { label: Chinese (Simplified), name: zh, widget: text, required: false }
          - label: Default keywords
            name: default_keywords
            widget: object
            required: false
            hint: "Used when a page sets neither a focus keyword nor a keyword list."
            fields:
              - label: English
                name: en
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
              - label: German
                name: de
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
              - label: French
                name: fr
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
              - label: Japanese
                name: ja
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
              - label: Spanish
                name: es
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
              - label: Chinese (Simplified)
                name: zh
                widget: list
                required: false
                field: { label: Keyword, name: keyword, widget: string }
          - label: Social profiles
            name: social
            widget: object
            required: false
            fields:
              - label: X
                name: x
                widget: string
                required: false
                hint: "Profile URL. The handle becomes twitter:site."
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Trustpilot, name: trustpilot, widget: string, required: false, hint: "Trustpilot review page URL. Listed in structured data sameAs." }
          - label: Public contact email
            name: contact_email
            widget: string
            required: false
            hint: "The one public email shown on the contact page, footer, privacy and terms pages and in structured data. Leave empty to show contact email coming soon."
            pattern: ['^$|^[^@\s]+@[^@\s]+\.[^@\s]+$', "Enter one email address, for example contact@sundayatlastravel.com"]
          - label: Organization logo
            name: organization_logo
            widget: image
            required: false
            hint: "Used in structured data. Leave empty to keep the current logo."
          - label: Google site verification
            name: google_site_verification
            widget: string
            required: false
            hint: "Paste the code from Google Search Console. Leave empty to omit the tag."
          - label: Bing site verification
            name: bing_site_verification
            widget: string
            required: false
            hint: "Paste the code from Bing Webmaster Tools. Leave empty to omit the tag."
          - label: Analytics
            name: analytics
            widget: object
            required: false
            fields:
              - label: Provider
                name: provider
                widget: select
                required: false
                default: none
                options: [none, ga4, cloudflare]
              - label: Measurement ID
                name: id
                widget: string
                required: false
                hint: "GA4 measurement ID or Cloudflare Web Analytics token. Leave empty to load nothing."
