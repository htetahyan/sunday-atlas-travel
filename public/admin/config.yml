# Decap CMS for Sunday Atlas Travel.
# Local: `npm run cms` and `npm run dev`, then open http://localhost:3000/admin/
# Production auth is not in this file. See docs/CMS.md. Do not put secrets here.

backend:
  name: github
  repo: htetahyan/rare-atlas-travel
  branch: main
  # Alternative: Netlify Identity + git-gateway. Not used on Cloudflare Pages.
  # name: git-gateway
  # branch: main
  # Cloudflare Worker OAuth proxy (workers/cms-auth).
  # Keep the GitHub OAuth client secret in the worker, not in this repo.
  base_url: https://rare-atlas-cms-auth.htetahyan.workers.dev
  auth_endpoint: auth

# Local editing is not enabled in this committed file.
# For local editing, add `local_backend: true` temporarily to your local copy,
# run `npx decap-server` (`npm run cms`), and never commit that line.

media_folder: public/uploads
public_folder: /uploads
media_library:
  name: cloudinary
  output_filename_only: false
  use_secure_url: true
  use_transformations: false
  config:
    cloud_name: di4a4oz3o
    api_key: 493622286779552
# Documented default origin for local Decap (`npm run cms`).
# `scripts/cms-site-url.mjs` runs as `postbuild` and rewrites these two lines
# in out/admin/config.yml from NEXT_PUBLIC_SITE_URL, with any trailing slash removed.
# If that variable is unset, the built file is left unchanged.
site_url: https://sundayatlastravel.com
display_url: https://sundayatlastravel.com

# Shared by destinations, packages, and static pages. Decap expands these anchors.
x-seo-locale-fields: &seo_locale_fields
  - label: SEO title
    name: seo_title
    widget: string
    required: false
    hint: "About 60 characters. Leave empty to use the automatic title."
    pattern: ["^.{0,65}$", "Keep the SEO title to about 60 characters (65 max)."]
  - label: Meta description
    name: meta_description
    widget: text
    required: false
    hint: "About 155 characters. Leave empty to use the automatic description."
    pattern: ["^[\\s\\S]{0,160}$", "Keep the meta description to about 155 characters (160 max)."]
  - label: Focus keyword
    name: focus_keyword
    widget: string
    required: false
    hint: "The main search phrase for this page. Use it in the page heading (H1), early in the description, and in at least one image alt text."
  - label: Keywords
    name: keywords
    widget: list
    required: false
    field: { label: Keyword, name: keyword, widget: string }
  - label: Social image
    name: og_image
    widget: image
    required: false
    hint: "Social share image override, ideally 1200x630. Leave empty to use the hero image."
  - label: Canonical URL
    name: canonical
    widget: string
    required: false
    hint: "Absolute URL or site path. Leave empty to use the page's own URL. Only set it for duplicates."
  - label: Noindex
    name: noindex
    widget: boolean
    required: false
    default: false
    hint: "Hides this page from search engines and removes it from the sitemap."

x-seo-locales: &seo_locales
  - label: SEO (English)
    name: en
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields
  - label: SEO (German)
    name: de
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields
  - label: SEO (French)
    name: fr
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields
  - label: SEO (Japanese)
    name: ja
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields
  - label: SEO (Spanish)
    name: es
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields
  - label: SEO (Chinese (Simplified))
    name: zh
    widget: object
    required: false
    collapsed: true
    fields: *seo_locale_fields

x-locale-string-fields: &locale_string_fields
  - { label: English, name: en, widget: string, required: false }
  - { label: German, name: de, widget: string, required: false }
  - { label: French, name: fr, widget: string, required: false }
  - { label: Japanese, name: ja, widget: string, required: false }
  - { label: Spanish, name: es, widget: string, required: false }
  - { label: Chinese (Simplified), name: zh, widget: string, required: false }

x-locale-text-fields: &locale_text_fields
  - { label: English, name: en, widget: text, required: false }
  - { label: German, name: de, widget: text, required: false }
  - { label: French, name: fr, widget: text, required: false }
  - { label: Japanese, name: ja, widget: text, required: false }
  - { label: Spanish, name: es, widget: text, required: false }
  - { label: Chinese (Simplified), name: zh, widget: text, required: false }

x-faqs: &faqs
  label: FAQs
  name: faqs
  widget: list
  required: false
  hint: "Question and answer pairs. Leave empty to hide the section."
  fields:
    - label: Question
      name: q
      widget: object
      required: true
      fields:
        - { label: English, name: en, widget: string, required: true }
        - { label: German, name: de, widget: string, required: false }
        - { label: French, name: fr, widget: string, required: false }
        - { label: Japanese, name: ja, widget: string, required: false }
        - { label: Spanish, name: es, widget: string, required: false }
        - { label: Chinese (Simplified), name: zh, widget: string, required: false }
    - label: Answer
      name: a
      widget: object
      required: true
      fields:
        - { label: English, name: en, widget: text, required: true }
        - { label: German, name: de, widget: text, required: false }
        - { label: French, name: fr, widget: text, required: false }
        - { label: Japanese, name: ja, widget: text, required: false }
        - { label: Spanish, name: es, widget: text, required: false }
        - { label: Chinese (Simplified), name: zh, widget: text, required: false }

x-faq-title: &faq_title
  label: FAQ title
  name: faq_title
  widget: object
  required: false
  hint: "Optional H2 above the questions. Use a secondary keyword."
  fields: *locale_string_fields

x-page-sections: &page_sections
  label: Content sections (H2 + text)
  name: sections
  widget: list
  required: false
  hint: "Shown only when this locale has both a heading and a body. English does not fill other locales."
  fields:
    - label: Heading
      name: heading
      widget: object
      required: false
      fields: *locale_string_fields
    - label: Body
      name: body
      widget: object
      required: false
      fields: *locale_text_fields

collections:
  - name: destinations
    label: Destinations
    folder: content/destinations
