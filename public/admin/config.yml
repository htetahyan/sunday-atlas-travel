      - label: Gallery
        name: gallery
        widget: list
        required: false
        default: []
        fields:
          - label: Image
            name: image
            widget: object
            required: true
            fields:
              - label: Source
                name: src
                widget: image
                required: true
              - label: Width
                name: width
                widget: number
                value_type: int
                required: true
              - label: Height
                name: height
                widget: number
                value_type: int
                required: true
          - label: Alt text
            name: alt
            widget: object
            required: true
            fields:
              - { label: English, name: en, widget: string, required: true }
              - { label: German, name: de, widget: string, required: false }
