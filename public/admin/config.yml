          - { label: Japanese, name: ja, widget: string, required: false }
          - { label: Spanish, name: es, widget: string, required: false }
          - { label: Chinese (Simplified), name: zh, widget: string, required: false }
      - label: Destination
        name: destination
        widget: relation
        collection: destinations
        value_field: slug
        search_fields: [name.en, slug]
        display_fields: [name.en]
        required: true
        hint: "Primary destination slug. The package is listed on this page and on every extra country below."
      - label: Countries
        name: countries
        widget: relation
        collection: destinations
        multiple: true
        value_field: slug
        search_fields: [name.en, slug]
        display_fields: [name.en]
        required: false
        default: []
        hint: "Other destinations on this tour. Leave empty for a single-country package."
      - label: Region
        name: region
        widget: object
        required: false
        hint: "Optional geographical region override (for example Central Asia). Leave empty to inherit the region from the Destination and Countries."
        fields: *locale_string_fields
      - label: Duration (days)
        name: durationDays
        widget: number
        value_type: int
        min: 1
        required: true
      - label: Nights
        name: nights
